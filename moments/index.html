<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share a JIWAR Moment – Care Medical Jiwar</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,100..1000&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: "Twemoji Country Flags", "DM Sans", "DM Sans Fallback", Arial, Helvetica, sans-serif;
    font-variation-settings: "opsz" 14, "wght" 750;
    font-weight: 750;
    background: #FFFFFF;
    background-image:
        linear-gradient(#e8e8e8 1px, transparent 1px),
        linear-gradient(90deg, #e8e8e8 1px, transparent 1px);
    background-size: 56px 56px;
    color: #17171D;
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
}

header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    background: #FFFFFF;
    padding: 8px 5%;
}

.navbar {
    max-width: 1920px;
    height: 58px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
}

.logo {
    width: 200px;
    height: 50px;
    object-fit: contain;
    transform: translate(-8px, 3px);
}

.header-nav {
    display: flex;
    align-items: center;
    gap: 28px;
}

.header-nav a {
    position: relative;
    color: rgb(23, 23, 29);
    text-decoration: none;
    font-size: 14.4px;
    font-weight: 750;
    padding: 9px 0;
}

.header-nav a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 5px;
    width: 0;
    height: 2px;
    background: #171717;
    transition: width 200ms ease;
}

.header-nav a:hover::after { width: 100%; }

.header-nav a.nominate-btn {
    display: flex;
    align-items: center;
    background-color: rgb(23, 23, 29) !important;
    color: #fff !important;
    border-radius: 999px;
    padding: 12px 17px;
    font-size: 15.04px;
    font-weight: 700;
    height: 46.5625px;
    text-decoration: none !important;
    column-gap: 16px;
}

.header-nav a.nominate-btn::after { display: none !important; }

.nominate-arrow {
    font-weight: 900;
    -webkit-text-stroke: 1.3px currentColor;
}

/* Scattered background messages */
.bg-messages {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
}

.bg-msg {
    position: absolute;
    color: #02102B;
    opacity: 0.12;
    font-size: clamp(0.85rem, 1.5vw, 1.05rem);
    font-weight: 750;
    max-width: 220px;
    line-height: 1.45;
    user-select: none;
}

.page {
    position: relative;
    z-index: 1;
    max-width: 560px;
    margin: 0 auto;
    padding: 110px 24px 80px;
}

.hero-line {
    margin-bottom: 4px;
    line-height: 1.25;
}

.hero-line .cyan {
    color: #0DC8EA;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: 750;
}

.hero-line .dark {
    color: #02102B;
    font-size: clamp(1.8rem, 4.5vw, 2.6rem);
    font-weight: 750;
}

.hero-sub {
    color: #0DC8EA;
    font-size: clamp(1.1rem, 2.5vw, 1.35rem);
    font-weight: 750;
    margin: 8px 0 36px;
}

.heart { color: #0DC8EA; }

.form-group {
    margin-bottom: 28px;
}

.form-group label {
    display: block;
    color: #02102B;
    font-size: 1rem;
    font-weight: 750;
    margin-bottom: 10px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    border: 1.5px solid #d0dce6;
    border-radius: 14px;
    padding: 14px 16px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: #17171D;
    background: rgba(255,255,255,0.92);
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    resize: vertical;
}

.form-group textarea {
    min-height: 110px;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: #0DC8EA;
    box-shadow: 0 0 0 3px rgba(13, 200, 234, 0.15);
}

.form-group input::placeholder,
.form-group textarea::placeholder {
    color: #9aabba;
    font-weight: 600;
}

.submit-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #02102B;
    color: #FFFFFF;
    border: none;
    border-radius: 18px;
    padding: 16px 26px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 750;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s ease, transform 0.2s ease;
}

.submit-btn:hover {
    opacity: 0.9;
    transform: translateY(-1px);
}

.submit-btn .arrow {
    font-weight: 900;
    -webkit-text-stroke: 1px currentColor;
}

/* Success state */
.form-wrap { display: block; }
.success-wrap {
    display: none;
    text-align: left;
    padding: 20px 0;
}

.success-wrap.visible { display: block; }
.form-wrap.hidden { display: none; }

.success-title {
    color: #02102B;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: 750;
    line-height: 1.3;
    margin-bottom: 12px;
}

.success-sub {
    color: #557083;
    font-size: 1.05rem;
    line-height: 1.7;
}

@media (max-width: 700px) {
    .logo { width: 62px; height: 62px; }
    .header-nav { gap: 16px; }
    .header-nav a.nominate-btn {
        font-size: 13.5px;
        padding: 10px 14px;
        height: 42px;
    }
    .page { padding: 100px 20px 60px; }
}
</style>
</head>
<body>

<header>
    <div class="navbar">
        <a href="/">
            <img src="/logo.jpg" alt="Company Logo" class="logo">
        </a>
        <nav class="header-nav">
            <a href="/winners/">Winners</a>
            <a href="/eoq/" class="nominate-btn">Nominate your stars <span class="nominate-arrow">→</span></a>
        </nav>
    </div>
</header>

<div class="bg-messages" id="bgMessages" aria-hidden="true"></div>

<main class="page">
    <div class="form-wrap" id="formWrap">
        <div class="hero-line">
            <span class="cyan">Got a</span>
        </div>
        <div class="hero-line">
            <span class="dark">JIWAR Moment?</span>
        </div>
        <p class="hero-sub">We'd love to hear it. <span class="heart">♥</span></p>

        <form id="momentForm" novalidate>
            <div class="form-group">
                <label for="whatHappened">Start anywhere...</label>
                <textarea id="whatHappened" name="whatHappened" placeholder="What happened?" required></textarea>
            </div>

            <div class="form-group">
                <label for="whoWasThere">Who was there?</label>
                <input type="text" id="whoWasThere" name="whoWasThere" placeholder="Name, team, or role">
            </div>

            <div class="form-group">
                <label for="whyStay">Why did it stay with you?</label>
                <textarea id="whyStay" name="whyStay" placeholder="What made it meaningful?"></textarea>
            </div>

            <button type="submit" class="submit-btn">
                MAKE IT A JIWAR MOMENT <span class="arrow">→</span>
            </button>
        </form>
    </div>

    <div class="success-wrap" id="successWrap">
        <h2 class="success-title">You just made it a JIWAR Moment!</h2>
        <p class="success-sub">Thanks for sharing, we love hearing moments like this.</p>
    </div>
</main>

<script>
/* Scattered background messages */
const messages = [
    "Maybe it was...",
    "A colleague who stayed a little longer.",
    "A team that came together when it mattered.",
    "A smile that crossed a language barrier.",
    "Someone who noticed when you needed help."
];

const container = document.getElementById("bgMessages");
const positions = [
    { top: "12%", left: "6%", rotate: -6 },
    { top: "18%", right: "8%", rotate: 4 },
    { top: "42%", left: "4%", rotate: 3 },
    { top: "55%", right: "5%", rotate: -5 },
    { top: "78%", left: "10%", rotate: 2 }
];

messages.forEach((text, i) => {
    const el = document.createElement("div");
    el.className = "bg-msg";
    el.textContent = text;
    const p = positions[i] || { top: "50%", left: "50%", rotate: 0 };
    el.style.top = p.top;
    if (p.left) el.style.left = p.left;
    if (p.right) el.style.right = p.right;
    el.style.transform = "rotate(" + p.rotate + "deg)";
    container.appendChild(el);
});

/* Form submit → success */
document.getElementById("momentForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const what = document.getElementById("whatHappened").value.trim();
    if (!what) {
        document.getElementById("whatHappened").focus();
        return;
    }
    document.getElementById("formWrap").classList.add("hidden");
    document.getElementById("successWrap").classList.add("visible");
});
</script>
</body>
</html>
