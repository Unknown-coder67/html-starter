<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share a JIWAR Moment – Care Medical Jiwar</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Allura&family=DM+Sans:opsz,wght@9..40,100..1000&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: "Twemoji Country Flags", "DM Sans", "DM Sans Fallback", Arial, Helvetica, sans-serif;
    font-variation-settings: "opsz" 14, "wght" 750;
    font-weight: 750;
    background: #FFFFFF;
    background-image:
        linear-gradient(#e8e8e8 1px, transparent 1px),
        linear-gradient(90deg, #e8e8e8 1px, transparent 1px);
    background-size: 56px 56px;
    color: #17171D;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
}

header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    background: #FFFFFF;
    padding: 8px 5%;
}

.navbar {
    max-width: 1920px;
    height: 58px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
}

.logo {
    width: 200px;
    height: 50px;
    object-fit: contain;
    transform: translate(-8px, 3px);
}

.header-nav {
    display: flex;
    align-items: center;
    gap: 28px;
}

.header-nav a {
    position: relative;
    text-decoration: none;
    color: #17171D;
    font-weight: 750;
    padding: 8px 2px;
    font-size: 14.4px;
}

.header-nav a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 5px;
    width: 0;
    height: 2px;
    background: #17171D;
    transition: width 200ms ease;
}

.header-nav a:hover::after {
    width: 100%;
}

.bg-messages {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
}

.bg-msg {
    position: absolute;
    color: #666666;
    opacity: 0.55;
    font-size: clamp(0.8rem, 1.4vw, 1rem);
    font-weight: 750;
    max-width: 200px;
    line-height: 1.45;
    user-select: none;
}

.page {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 110px 24px 60px;
}

.card {
    background: #FFFFFF;
    border-radius: 20px;
    padding: 40px 36px 36px;
    max-width: 520px;
    width: 100%;
    box-shadow: 0 4px 24px rgba(23, 50, 77, 0.06);
    border: 1px solid #eef2f5;
}

.hero-line {
    margin-bottom: 2px;
    line-height: 1.2;
}

.hero-line .cyan {
    font-family: "Allura", cursive;
    color: #0DC8EA;
    font-size: clamp(2.4rem, 6vw, 3.4rem);
    font-weight: 400;
    line-height: 1.1;
}

.hero-line .dark {
    color: #02102B;
    font-size: clamp(1.8rem, 4.5vw, 2.5rem);
    font-weight: 750;
}

.hero-sub {
    color: #0DC8EA;
    font-size: clamp(1.1rem, 2.5vw, 1.3rem);
    font-weight: 750;
    margin: 10px 0 32px;
}

.heart { color: #0DC8EA; }

.form-group {
    margin-bottom: 24px;
}

.form-group label {
    display: block;
    color: #02102B;
    font-size: 1rem;
    font-weight: 750;
    margin-bottom: 10px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    border: 1.5px solid #d0dce6;
    border-radius: 14px;
    padding: 14px 16px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: #17171D;
    background: #FFFFFF;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    resize: vertical;
}

.form-group textarea { min-height: 100px; }

.form-group input:focus,
.form-group textarea:focus {
    border-color: #0DC8EA;
    box-shadow: 0 0 0 3px rgba(13, 200, 234, 0.15);
}

.form-group input::placeholder,
.form-group textarea::placeholder {
    color: #9aabba;
    font-weight: 600;
}

.submit-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #02102B;
    color: #FFFFFF;
    border: none;
    border-radius: 18px;
    padding: 16px 26px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 750;
    cursor: pointer;
    margin-top: 6px;
    transition: opacity 0.2s ease, transform 0.2s ease;
}

.submit-btn:hover {
    opacity: 0.9;
    transform: translateY(-1px);
}

.submit-btn .arrow {
    font-weight: 900;
    -webkit-text-stroke: 1px currentColor;
}

.form-wrap { display: block; }
.success-wrap {
    display: none;
    padding: 8px 0;
}
.success-wrap.visible { display: block; }
.form-wrap.hidden { display: none; }

.success-title {
    color: #02102B;
    font-size: clamp(1.5rem, 4vw, 2rem);
    font-weight: 750;
    line-height: 1.3;
    margin-bottom: 12px;
}

.success-sub {
    color: #557083;
    font-size: 1.05rem;
    line-height: 1.7;
    margin-bottom: 28px;
}

.success-links {
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: flex-start;
}

.success-link {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #17171D;
    font-weight: 750;
    font-size: 1rem;
    text-decoration: none;
    padding: 4px 0 6px;
    border-bottom: 2px solid #17171D;
}

.success-link .arrow {
    font-weight: 900;
    -webkit-text-stroke: 1px currentColor;
}

footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 18px 20px;
    color: #96939D;
    font-size: 0.7rem;
    background: #17171D;
}

@media (max-width: 700px) {
    .logo { width: 62px; height: 62px; }
    .page { padding: 100px 16px 40px; }
    .card { padding: 28px 22px 28px; }
}
</style>
</head>
<body>

<header>
    <div class="navbar">
        <a href="/">
            <img src="/logo.jpg" alt="Company Logo" class="logo">
        </a>
        <nav class="header-nav">
            <a href="/">Home</a>
        </nav>
    </div>
</header>

<div class="bg-messages" id="bgMessages" aria-hidden="true"></div>

<main class="page">
    <div class="card">
        <div class="form-wrap" id="formWrap">
            <div class="hero-line">
                <span class="cyan">Got a</span>
            </div>
            <div class="hero-line">
                <span class="dark">JIWAR Moment?</span>
            </div>
            <p class="hero-sub">We'd love to hear it. <span class="heart">♥</span></p>

            <form id="momentForm" novalidate>
                <div class="form-group">
                    <label for="whatHappened">Start anywhere...</label>
                    <textarea id="whatHappened" name="whatHappened" placeholder="What happened?" maxlength="280" required></textarea>
                </div>

                <div class="form-group">
                    <label for="whoWasThere">Who was there?</label>
                    <input type="text" id="whoWasThere" name="whoWasThere" placeholder="Name, team, or role" maxlength="48">
                </div>

                <div class="form-group">
                    <label for="whyStay">Why did it stay with you?</label>
                    <textarea id="whyStay" name="whyStay" placeholder="What made it meaningful?" maxlength="200"></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    MAKE IT A JIWAR MOMENT <span class="arrow">→</span>
                </button>
            </form>
        </div>

        <div class="success-wrap" id="successWrap">
            <h2 class="success-title">You just made it a JIWAR Moment!</h2>
            <p class="success-sub">Thanks for sharing, we love hearing moments like this.</p>
            <div class="success-links">
                <a href="/" class="success-link">Return Home <span class="arrow">→</span></a>
                <a href="/moments/" class="success-link" id="shareAnother">Share another moment! <span class="arrow">→</span></a>
            </div>
        </div>
    </div>
</main>

<footer>
    © 2026 Care Medical Jiwar
</footer>

<script>
var messages = [
    "Maybe it was...",
    "A colleague who stayed a little longer.",
    "A team that came together when it mattered.",
    "A smile that crossed a language barrier.",
    "Someone who noticed when you needed help.",
    "A quiet thank-you that meant everything.",
    "Covering a shift so someone could rest.",
    "A hand on the shoulder at the right time.",
    "Laughing together after a long day.",
    "Sharing knowledge without being asked.",
    "Remembering a detail that made someone feel seen.",
    "Staying late so the team could go home."
];

var container = document.getElementById("bgMessages");
var positions = [
    { top: "10%", left: "4%", rotate: -7 },
    { top: "14%", right: "6%", rotate: 5 },
    { top: "28%", left: "3%", rotate: 3 },
    { top: "32%", right: "4%", rotate: -4 },
    { top: "48%", left: "5%", rotate: -6 },
    { top: "52%", right: "7%", rotate: 4 },
    { top: "66%", left: "4%", rotate: 2 },
    { top: "70%", right: "5%", rotate: -5 },
    { top: "82%", left: "8%", rotate: 3 },
    { top: "18%", left: "22%", rotate: -2 },
    { top: "58%", left: "18%", rotate: 6 },
    { top: "40%", right: "18%", rotate: -3 }
];

messages.forEach(function (text, i) {
    var el = document.createElement("div");
    el.className = "bg-msg";
    el.textContent = text;
    var p = positions[i] || { top: "50%", left: "50%", rotate: 0 };
    el.style.top = p.top;
    if (p.left) el.style.left = p.left;
    if (p.right) el.style.right = p.right;
    el.style.transform = "rotate(" + p.rotate + "deg)";
    container.appendChild(el);
});

document.getElementById("shareAnother").addEventListener("click", function (e) {
    e.preventDefault();
    document.getElementById("momentForm").reset();
    document.getElementById("successWrap").classList.remove("visible");
    document.getElementById("formWrap").classList.remove("hidden");
});

document.getElementById("momentForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var what = document.getElementById("whatHappened").value.trim();
    if (!what) {
        document.getElementById("whatHappened").focus();
        return;
    }
    try {
        var moments = JSON.parse(localStorage.getItem("jiwar_moments") || "[]");
        moments.push({
            what: what,
            who: document.getElementById("whoWasThere").value.trim(),
            why: document.getElementById("whyStay").value.trim(),
            at: Date.now()
        });
        localStorage.setItem("jiwar_moments", JSON.stringify(moments.slice(-20)));
    } catch (err) {}
    document.getElementById("formWrap").classList.add("hidden");
    document.getElementById("successWrap").classList.add("visible");
});
</script>
</body>
</html>
