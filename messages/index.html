<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write a Message – Care Medical Jiwar</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,100..1000&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: "Twemoji Country Flags", "DM Sans", "DM Sans Fallback", Arial, Helvetica, sans-serif;
    font-variation-settings: "opsz" 14, "wght" 750;
    font-weight: 750;
    background: #FFFFFF;
    background-image:
        linear-gradient(#e8e8e8 1px, transparent 1px),
        linear-gradient(90deg, #e8e8e8 1px, transparent 1px);
    background-size: 56px 56px;
    color: #17171D;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
}

header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    background: #FFFFFF;
    padding: 8px 5%;
}

.navbar {
    max-width: 1920px;
    height: 58px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
}

.logo {
    width: 200px;
    height: 50px;
    object-fit: contain;
    transform: translate(-8px, 3px);
}

.header-nav {
    display: flex;
    align-items: center;
    gap: 28px;
}

.header-nav a {
    position: relative;
    text-decoration: none;
    color: #17171D;
    font-weight: 750;
    padding: 8px 2px;
    font-size: 14.4px;
}

.header-nav a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 5px;
    width: 0;
    height: 2px;
    background: #17171D;
    transition: width 200ms ease;
}

.header-nav a:hover::after {
    width: 100%;
}

.page {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 110px 24px 60px;
}

.card {
    background: #FFFFFF;
    border-radius: 20px;
    padding: 40px 36px 36px;
    max-width: 520px;
    width: 100%;
    box-shadow: 0 4px 24px rgba(23, 50, 77, 0.06);
    border: 1px solid #eef2f5;
}

.hero-line {
    margin-bottom: 4px;
    line-height: 1.3;
}

.hero-line .dark {
    color: #02102B;
    font-size: clamp(1.5rem, 4vw, 2rem);
    font-weight: 750;
}

.hero-sub {
    color: #0DC8EA;
    font-size: clamp(1.2rem, 3vw, 1.45rem);
    font-weight: 750;
    margin: 10px 0 32px;
}

.heart { color: #0DC8EA; }

.form-group {
    margin-bottom: 24px;
}

.form-group label {
    display: block;
    color: #02102B;
    font-size: 1rem;
    font-weight: 750;
    margin-bottom: 10px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    border: 1.5px solid #d0dce6;
    border-radius: 14px;
    padding: 14px 16px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: #17171D;
    background: #FFFFFF;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    resize: vertical;
}

.form-group textarea { min-height: 110px; }

.form-group input:focus,
.form-group textarea:focus {
    border-color: #0DC8EA;
    box-shadow: 0 0 0 3px rgba(13, 200, 234, 0.15);
}

.form-group input::placeholder,
.form-group textarea::placeholder {
    color: #9aabba;
    font-weight: 600;
}

.rotating-placeholder-wrap {
    position: relative;
}

.rotating-placeholder {
    position: absolute;
    top: 14px;
    left: 16px;
    right: 16px;
    color: #9aabba;
    font-size: 1rem;
    font-weight: 600;
    pointer-events: none;
    line-height: 1.5;
    transition: opacity 0.45s ease;
    opacity: 1;
}

.rotating-placeholder.fade-out { opacity: 0; }

.rotating-placeholder-wrap.has-value .rotating-placeholder {
    display: none;
}

.radio-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 12px;
}

.radio-option {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    color: #02102B;
    font-size: 1rem;
    font-weight: 750;
}

.radio-option input[type="radio"] {
    appearance: none;
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border: 2px solid #c5d4e0;
    border-radius: 50%;
    margin: 0;
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    transition: border-color 0.2s ease;
}

.radio-option input[type="radio"]:checked {
    border-color: #02102B;
}

.radio-option input[type="radio"]:checked::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #02102B;
}

.name-field-wrap {
    display: none;
    margin-top: 14px;
}

.name-field-wrap.visible { display: block; }

.submit-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #02102B;
    color: #FFFFFF;
    border: none;
    border-radius: 18px;
    padding: 16px 26px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 750;
    cursor: pointer;
    margin-top: 10px;
    transition: opacity 0.2s ease, transform 0.2s ease;
}

.submit-btn:hover {
    opacity: 0.9;
    transform: translateY(-1px);
}

.submit-btn .arrow {
    font-weight: 900;
    -webkit-text-stroke: 1px currentColor;
}

.form-wrap { display: block; }
.success-wrap {
    display: none;
    padding: 8px 0;
}
.success-wrap.visible { display: block; }
.form-wrap.hidden { display: none; }

.success-title {
    color: #02102B;
    font-size: clamp(1.8rem, 4.5vw, 2.4rem);
    font-weight: 750;
    line-height: 1.3;
    margin-bottom: 28px;
}

.success-heart {
    color: #0DC8EA;
}

.success-links {
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: flex-start;
}

.success-link {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #17171D;
    font-weight: 750;
    font-size: 1rem;
    text-decoration: none;
    padding: 4px 0 6px;
    border-bottom: 2px solid #17171D;
}

.success-link .arrow {
    font-weight: 900;
    -webkit-text-stroke: 1px currentColor;
}

footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 18px 20px;
    color: #96939D;
    font-size: 0.7rem;
    background: #17171D;
}

@media (max-width: 700px) {
    .logo { width: 62px; height: 62px; }
    .page { padding: 100px 16px 40px; }
    .card { padding: 28px 22px 28px; }
}
</style>
</head>
<body>

<header>
    <div class="navbar">
        <a href="/">
            <img src="/logo.jpg" alt="Company Logo" class="logo">
        </a>
        <nav class="header-nav">
            <a href="/">Home</a>
        </nav>
    </div>
</header>

<main class="page">
    <div class="card">
        <div class="form-wrap" id="formWrap">
            <div class="hero-line">
                <span class="dark">Someone made your day a little better?</span>
            </div>
            <p class="hero-sub">Tell them. <span class="heart">♥</span></p>

            <form id="messageForm" novalidate>
                <div class="form-group">
                    <label for="thankWho">Who would you like to thank?</label>
                    <input type="text" id="thankWho" name="thankWho" placeholder="Name or department" maxlength="32" required>
                </div>

                <div class="form-group">
                    <label for="messageText">What do you want them to know?</label>
                    <div class="rotating-placeholder-wrap" id="placeholderWrap">
                        <div class="rotating-placeholder" id="rotatingPlaceholder"></div>
                        <textarea id="messageText" name="messageText" rows="4" maxlength="200" required></textarea>
                    </div>
                </div>

                <div class="form-group">
                    <label>Your name?</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="identity" value="named" id="optNamed">
                            My name
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="identity" value="anonymous" id="optAnonymous" checked>
                            Keep it anonymous
                        </label>
                    </div>
                    <div class="name-field-wrap" id="nameFieldWrap">
                        <input type="text" id="senderName" name="senderName" placeholder="Please enter your name" maxlength="40">
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    Put it on the wall <span class="arrow">→</span>
                </button>
            </form>
        </div>

        <div class="success-wrap" id="successWrap">
            <h2 class="success-title">IT'S ON THE WALL! <span class="success-heart">♥</span></h2>
            <div class="success-links">
                <a href="/" class="success-link">Return Home <span class="arrow">→</span></a>
                <a href="/messages/" class="success-link" id="writeAnother">Write another message! <span class="arrow">→</span></a>
            </div>
        </div>
    </div>
</main>

<footer>
    © 2026 Care Medical Jiwar
</footer>

<script>
var placeholders = [
    "Thank you for always having our back",
    "Thank you for your patience, your help and your constant positivity",
    "You made a tough day feel lighter — thank you",
    "Grateful for the way you show up for the team every day",
    "Your kindness didn't go unnoticed. Thank you."
];

var rotatingEl = document.getElementById("rotatingPlaceholder");
var messageTextarea = document.getElementById("messageText");
var placeholderWrap = document.getElementById("placeholderWrap");
var placeholderIndex = 0;

function showPlaceholder(index) {
    rotatingEl.classList.add("fade-out");
    setTimeout(function () {
        rotatingEl.textContent = placeholders[index];
        rotatingEl.classList.remove("fade-out");
    }, 450);
}

rotatingEl.textContent = placeholders[0];

setInterval(function () {
    if (messageTextarea.value.trim().length > 0) return;
    placeholderIndex = (placeholderIndex + 1) % placeholders.length;
    showPlaceholder(placeholderIndex);
}, 4000);

messageTextarea.addEventListener("input", function () {
    if (this.value.trim().length > 0) {
        placeholderWrap.classList.add("has-value");
    } else {
        placeholderWrap.classList.remove("has-value");
    }
});

var optNamed = document.getElementById("optNamed");
var optAnonymous = document.getElementById("optAnonymous");
var nameFieldWrap = document.getElementById("nameFieldWrap");

function updateNameField() {
    if (optNamed.checked) {
        nameFieldWrap.classList.add("visible");
        document.getElementById("senderName").focus();
    } else {
        nameFieldWrap.classList.remove("visible");
    }
}

optNamed.addEventListener("change", updateNameField);
optAnonymous.addEventListener("change", updateNameField);

document.getElementById("writeAnother").addEventListener("click", function (e) {
    e.preventDefault();
    document.getElementById("messageForm").reset();
    placeholderWrap.classList.remove("has-value");
    nameFieldWrap.classList.remove("visible");
    optAnonymous.checked = true;
    document.getElementById("successWrap").classList.remove("visible");
    document.getElementById("formWrap").classList.remove("hidden");
});

document.getElementById("messageForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var who = document.getElementById("thankWho").value.trim();
    var msg = document.getElementById("messageText").value.trim();
    if (!who) {
        document.getElementById("thankWho").focus();
        return;
    }
    if (!msg) {
        document.getElementById("messageText").focus();
        return;
    }
    var fromName = null;
    if (optNamed.checked) {
        fromName = document.getElementById("senderName").value.trim();
        if (!fromName) {
            document.getElementById("senderName").focus();
            return;
        }
    }
    try {
        var notes = JSON.parse(localStorage.getItem("jiwar_wall") || "[]");
        notes.push({
            to: who.slice(0, 32),
            message: msg.slice(0, 200),
            from: fromName ? fromName.slice(0, 40) : null,
            at: Date.now()
        });
        localStorage.setItem("jiwar_wall", JSON.stringify(notes.slice(-30)));
    } catch (err) {}
    document.getElementById("formWrap").classList.add("hidden");
    document.getElementById("successWrap").classList.add("visible");
});
</script>
</body>
</html>
