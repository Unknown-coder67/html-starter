<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Care Medical Jiwar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --navy: #08245B;
    --cyan: #00B7E2;
    --dark-cyan: #0E7490;
    --muted: #557083;
    --line: #dbe7ee;
    --red: #dc2626;
    --orange: #ea580c;
    --dark-green: #15803d;
    --green: #16a34a;
}

html {
    min-height: 100%;
    min-height: 100dvh;
    min-height: -webkit-fill-available;
    overflow-y: scroll;
    background-color: #FFFFFF;
    background: #FFFFFF;
}

body {
    font-family: "DM Sans", Arial, Helvetica, sans-serif;
    font-variation-settings: "opsz" 14, "wght" 750;
    font-optical-sizing: none;
    font-weight: 500;
    color: var(--navy);
    line-height: 1.5;
    min-height: 100%;
    min-height: 100dvh;
    min-height: -webkit-fill-available;
    background-color: #FFFFFF;
    background-image: url("/desktop-background.jpg");
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    padding-top: 74px;
    padding-bottom: env(safe-area-inset-bottom, 0);
    position: relative;
    display: flex;
    flex-direction: column;
}

body::after {
    content: "";
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: env(safe-area-inset-bottom, 0px);
    background: #FFFFFF;
    z-index: 10000;
    pointer-events: none;
}

footer {
    text-align: center;
    padding: 18px 20px;
    padding-bottom: max(18px, env(safe-area-inset-bottom, 18px));
    color: #02102B;
    font-size: 0.7rem;
    background: #FFFFFF;
    margin-top: auto;
}
</style>
</head>
<body>

<header>
    <div class="navbar">
        <a href="/"><img src="/logo.jpg" alt="Care Medical Jiwar" class="logo"></a>
        <nav class="header-nav">
            <a href="/eoq/" class="nav-btn">EOQ</a>
            <a href="/winners" class="nav-btn active">WINNERS</a>
        </nav>
    </div>
</header>

</footer>
