<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winners | Care Medical Jiwar</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,100..1000&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Twemoji Country Flags", "DM Sans", "DM Sans Fallback", Arial, Helvetica, sans-serif;
    font-feature-settings: normal;
    font-variation-settings: "opsz" 14, "wght" 750;
    font-optical-sizing: none;
    font-weight: 750;
    font-style: normal;
    background: #02102B;
    color: #FFFFFF;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    padding-top: 74px;
}

/* Fixed header */
header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    background: #FFFFFF;
    border-bottom: none;
    padding: 8px 5%;
}

.navbar {
    max-width: 1920px;
    height: 58px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
}

.logo {
    width: 200px;
    height: 50px;
    object-fit: contain;
    transform: translate(-8px, 3px);
}

nav a {
    position: relative;
    text-decoration: none;
    color: #17171D;
    font-weight: 750;
    padding: 8px 2px;
}

nav a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 5px;
    width: 0;
    height: 2px;
    background: #17171D;
    transition: width 200ms ease;
}

nav a:hover::after {
    width: 100%;
}

/* INTRO SECTION */
.intro-section {
    background-color: #02102B;
    background-image:
        linear-gradient(rgba(0, 0, 0, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    padding: 60px 5% 70px;
    text-align: center;
}

.intro-inner {
    max-width: 1280px;
    margin: 0 auto;
}

.intro-section .label {
    color: #888888;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
    font-weight: 500;
}

.intro-section h1 {
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    font-weight: 750;
    margin-bottom: 14px;
    color: #FFFFFF;
}

.intro-section p {
    color: #888888;
    font-size: 1.05rem;
    max-width: 540px;
    margin: 0 auto;
    line-height: 1.7;
    font-weight: 500;
}

/* MAIN CONTENT */
.main-content {
    width: 92%;
    max-width: 1400px;
    margin: 0 auto 100px;
    padding-top: 60px;
}

/* QUARTER BLOCK */
.quarter-block {
    display: flex;
    gap: 0;
    margin-bottom: 80px;
    position: relative;
}

.quarter-label {
    width: 180px;
    flex-shrink: 0;
    padding-right: 24px;
    padding-top: 8px;
}

.quarter-label h2 {
    font-size: 1.3rem;
    font-weight: 750;
    color: #FFFFFF;
    line-height: 1.3;
    margin-bottom: 6px;
}

.quarter-label .status {
    font-size: 0.9rem;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.55);
}

.quarter-label .status.stay-tuned {
    color: #0DC8EA;
}

/* Vertical line */
.timeline-line {
    width: 2px;
    background: linear-gradient(to bottom, #0DC8EA 0%, rgba(13, 200, 234, 0.25) 100%);
    border-radius: 2px;
    flex-shrink: 0;
    margin-right: 32px;
    align-self: stretch;
}

/* ===== MODERN MASONRY / RANDOM-FEEL GRID ===== */
.winners-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    grid-auto-rows: 10px;          /* small row unit for masonry effect */
    gap: 18px 20px;
    align-items: start;
}

/* Card */
.winner-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 18px;
    padding: 22px 18px 20px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                background 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;
    /* random-looking vertical span via JS (see script) */
}

.winner-card:hover {
    transform: translateY(-6px) scale(1.02);
    background: rgba(13, 200, 234, 0.07);
    border-color: rgba(13, 200, 234, 0.35);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
}

.winner-card-image {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    overflow: hidden;
    margin-bottom: 14px;
    background: rgba(255, 255, 255, 0.08);
    border: 2px solid rgba(255, 255, 255, 0.12);
    flex-shrink: 0;
}

.winner-card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.winner-card h3 {
    font-size: 0.98rem;
    font-weight: 750;
    color: #FFFFFF;
    margin-bottom: 4px;
    line-height: 1.3;
}

.winner-card .department {
    font-size: 0.78rem;
    font-weight: 600;
    color: #0DC8EA;
    letter-spacing: 0.02em;
    margin-bottom: 0;
}

/* Stay-tuned */
.stay-tuned-block {
    margin-bottom: 64px;
}

.stay-tuned-block .quarter-label {
    width: auto;
}

/* Fade animation */
.fade-in {
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 1.1s ease, transform 1.1s ease;
}

.fade-in.visible {
    opacity: 1;
    transform: translateY(0);
}

/* Footer */
footer {
    text-align: center;
    padding: 18px 20px;
    color: #96939D;
    font-size: 0.7rem;
    background: #17171D;
}

/* RESPONSIVE */
@media (max-width: 1100px) {
    .winners-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    }
}

@media (max-width: 900px) {
    .quarter-label {
        width: 150px;
    }
}

@media (max-width: 700px) {
    body {
        padding-top: 74px;
    }

    .logo {
        width: 62px;
        height: 62px;
        transform: none;
    }

    .intro-section {
        padding: 40px 5% 50px;
    }

    .main-content {
        width: 92%;
        padding-top: 40px;
    }

    .intro-section h1 {
        font-size: 2rem;
    }

    .quarter-block {
        flex-direction: column;
        gap: 20px;
        margin-bottom: 56px;
    }

    .quarter-label {
        width: 100%;
        padding-right: 0;
        padding-top: 0;
    }

    .timeline-line {
        display: none;
    }

    .winners-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px 12px;
        grid-auto-rows: 8px;
    }

    .winner-card {
        padding: 16px 14px 14px;
        border-radius: 14px;
    }

    .winner-card-image {
        width: 52px;
        height: 52px;
        margin-bottom: 10px;
    }

    .winner-card h3 {
        font-size: 0.88rem;
    }

    .winner-card .department {
        font-size: 0.72rem;
    }

    .quarter-block {
        margin-bottom: 40px;
    }

    .main-content {
        padding-top: 30px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .fade-in {
        opacity: 1;
        transform: none;
        transition: none;
    }
    .winner-card {
        transition: none;
    }
}
</style>
</head>

<body>

<header>
    <div class="navbar">
        <a href="/">
            <img src="/logo.jpg" alt="Care Medical Jiwar" class="logo">
        </a>
        <nav>
            <a href="/">Home</a>
        </nav>
    </div>
</header>

<!-- INTRO -->
<section class="intro-section">
    <div class="intro-inner">
        <p class="label">Recognition Hall</p>
        <h1>Our Winners</h1>
        <p>
            Celebrating the people whose dedication, care and excellence
            have shaped our culture every quarter.
        </p>
    </div>
</section>

<main class="main-content">

    <!-- Q4 2026 – Stay tuned -->
    <div class="stay-tuned-block fade-in">
        <div class="quarter-label">
            <h2>Q4 2026</h2>
            <div class="status stay-tuned">Stay tuned</div>
        </div>
    </div>

    <!-- ========== Q3 2026 ========== -->
    <div class="quarter-block fade-in">
        <div class="quarter-label">
            <h2>Q3 2026</h2>
        </div>
        <div class="timeline-line"></div>

        <!-- Masonry + random order grid -->
        <div class="winners-grid" id="winnersGrid">
            <!-- Cards are injected / shuffled by JS so order is random every load -->
        </div>
    </div>

</main>

<footer>
    © 2026 Care Medical Jiwar
</footer>

<script>
/* ===== Winner data ===== */
const winners = [
    { name: "Ahmed Al-Dajani",        dept: "Receptionist",           img: "/winner1.jpg" },
    { name: "Shrooq Al-Obaidi",       dept: "Supply Chain",           img: "/winner2.jpg" },
    { name: "Sohaib Abdulrheem",     dept: "RCM",                    img: "/winner3.jpg" },
    { name: "Gazi Alabashi",         dept: "Security",               img: "/winner4.jpg" },
    { name: "Abdulaziz Al-Andijani", dept: "Duty Manager",           img: "/winner5.jpg" },
    { name: "Bandar Al-huthali",     dept: "Driver",                 img: "/winner6.jpg" },
    { name: "Rehab Hamed",           dept: "EDU",                    img: "/winner7.jpg" },
    { name: "Mohammed Ghonim",       dept: "ICU HN",                 img: "/winner8.jpg" },
    { name: "Abdulilah Al-Zahrani",  dept: "RT",                     img: "/winner9.jpg" },
    { name: "Fahad Al-Nufaiai",      dept: "Radiology Supervisor",   img: "/winner10.jpg" },
    { name: "Abdullah Y. Abdullah",  dept: "Pharmacist Supervisor",  img: "/winner11.jpg" },
    { name: "Abdullah Al-Hazmi",     dept: "Lab",                    img: "/winner12.jpg" },
    { name: "Mohammed Rizk",         dept: "QPS Specialist",         img: "/winner13.jpg" },
    { name: "Dina Al-Rashidi",       dept: "Social Worker",          img: "/winner14.jpg" }  // ← new
];

/* Fisher–Yates shuffle → true random order every page load */
function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

/* Render cards with random vertical spans for a modern masonry feel */
function renderWinners() {
    const grid = document.getElementById("winnersGrid");
    const shuffled = shuffle([...winners]);

    grid.innerHTML = shuffled.map((w, i) => {
        // Random-ish row span (creates the uneven “scattered” look)
        const span = 12 + Math.floor(Math.random() * 6); // 12–17 row units

        return `
            <div class="winner-card" style="grid-row-end: span ${span}">
                <div class="winner-card-image">
                    <img src="${w.img}" alt="${w.name}">
                </div>
                <h3>${w.name}</h3>
                <div class="department">${w.dept}</div>
            </div>
        `;
    }).join("");
}

/* Fade-in observer (unchanged) */
const fadeElements = document.querySelectorAll(".fade-in");
const fadeObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
        if (entry.isIntersecting) {
            entry.target.classList.add("visible");
        } else {
            entry.target.classList.remove("visible");
        }
    });
}, {
    threshold: 0.15,
    rootMargin: "-15% 0px -15% 0px"
});

fadeElements.forEach((el) => fadeObserver.observe(el));

window.addEventListener("load", () => {
    renderWinners();                       // shuffle + build cards

    document.querySelectorAll(".fade-in").forEach((el, index) => {
        const rect = el.getBoundingClientRect();
        if (rect.top < window.innerHeight * 0.85) {
            setTimeout(() => el.classList.add("visible"), 40 + index * 60);
        }
    });
});
</script>

</body>
</html>
