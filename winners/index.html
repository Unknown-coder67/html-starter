<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Winners | Care Medical Jiwar</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,100..1000&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Twemoji Country Flags", "DM Sans", "DM Sans Fallback", Arial, Helvetica, sans-serif;
    font-feature-settings: normal;
    font-variation-settings: "opsz" 14, "wght" 750;
    font-optical-sizing: none;
    font-weight: 750;
    font-style: normal;
    background: #02102B;
    color: #888888;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    padding-top: 74px;
    overflow-x: hidden;

    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    background: #FFFFFF;
    border-bottom: none;
    padding: 8px 5%;
}

.navbar {
    max-width: 1920px;
    height: 58px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
}

.logo {
    width: 200px;
    height: 50px;
    object-fit: contain;
    transform: translate(-8px, 3px);
}

nav a {
    position: relative;
    text-decoration: none;
    color: #08245B;
    font-weight: 750;
    padding: 8px 2px;
}

nav a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 5px;
    width: 0;
    height: 2px;
    background: #00B7E2;
    transition: width 200ms ease;
}

nav a:hover {
    color: #00B7E2;
}
    
nav a:hover::after {
    width: 100%;
}

.intro-section {
    background-color: #02102B;
    background-image:
        linear-gradient(rgba(0, 0, 0, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    padding: 60px 5% 70px;
    text-align: center;
}

.intro-inner {
    max-width: 1280px;
    margin: 0 auto;
}

.intro-section .label {
    color: #888888;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
    font-weight: 500;
}

.intro-section h1 {
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    font-weight: 750;
    margin-bottom: 14px;
    color: #FFFFFF;
}

.intro-section p {
    color: #888888;
    font-size: 1.05rem;
    max-width: 540px;
    margin: 0 auto;
    line-height: 1.7;
    font-weight: 500;
}

.main-content {
    width: 92%;
    max-width: 1400px;
    margin: 0 auto 40px;
    padding-top: 90px;
    padding-bottom: 300px;
    flex: 1;
}

.quarter-block {
    display: flex;
    gap: 0;
    margin-bottom: 80px;
    position: relative;
}

.quarter-label {
    width: 180px;
    flex-shrink: 0;
    padding-right: 24px;
    padding-top: 8px;
}

.quarter-label h2 {
    font-size: 1.3rem;
    font-weight: 750;
    color: #FFFFFF;
    line-height: 1.3;
    margin-bottom: 6px;
}

.quarter-label .status {
    font-size: 0.9rem;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.55);
}

.quarter-label .status.stay-tuned {
    color: #0DC8EA;
}

.timeline-line {
    width: 2px;
    background: linear-gradient(to bottom, #0DC8EA 0%, rgba(13, 200, 234, 0.25) 100%);
    border-radius: 2px;
    flex-shrink: 0;
    margin-right: 32px;
    align-self: stretch;
}

.timeline-line.short {
    height: 48px;
    align-self: flex-start;
    margin-top: 6px;
    margin-right: 0;
}

.winners-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 28px 22px;
    min-width: 0;
}

.winner-card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding: 4px 0;
    transition: transform 0.25s ease;
    min-width: 0;
}

.winner-card:hover {
    transform: translateY(-3px);
}

.winner-card-image {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    overflow: hidden;
    margin-bottom: 12px;
    background: rgba(255, 255, 255, 0.08);
    border: 2px solid rgba(255, 255, 255, 0.12);
    flex-shrink: 0;
}

.winner-card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.winner-card h3 {
    font-size: 0.98rem;
    font-weight: 750;
    color: #FFFFFF;
    margin-bottom: 2px;
    line-height: 1.3;
    word-break: break-word;
}

.winner-card .department {
    font-size: 0.78rem;
    font-weight: 600;
    color: #0DC8EA;
    margin-bottom: 6px;
    letter-spacing: 0.02em;
}

.winner-card p {
    font-size: 0.95rem;
    font-weight: 500;
    color: #888888;
    line-height: 1.6;
}

.stay-tuned-block {
    display: flex;
    gap: 0;
    margin-bottom: 80px;
    margin-top: 20px;
    position: relative;
    align-items: flex-start;
}

.stay-tuned-block .quarter-label {
    width: 180px;
    flex-shrink: 0;
    padding-right: 24px;
    padding-top: 8px;
}

.stay-tuned-track {
    flex: 1;
    position: relative;
    height: 48px;
    overflow: hidden;
    display: flex;
    align-items: center;
    min-width: 0;
    container-type: inline-size;
}

.stay-tuned-text {
    position: absolute;
    top: 50%;
    left: 0;
    white-space: nowrap;
    font-size: 0.95rem;
    font-weight: 600;
    color: #FFFFFF;
    letter-spacing: 0.03em;
    will-change: transform;
    animation: stayTunedRight 14s linear infinite;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

@keyframes stayTunedRight {
    0% {
        transform: translateY(-50%) translateX(-100%);
    }
    100% {
        transform: translateY(-50%) translateX(100cqw);
    }
}

.stay-tuned-block,
.quarter-block {
    opacity: 0.22;
    transition: opacity 0.4s ease;
}

.stay-tuned-block.is-active-block,
.quarter-block.is-active-block {
    opacity: 1 !important;
}

.story-continues {
    text-align: center;
    padding: 40px 5% 50px;
    background: #02102B;
}

.story-continues .logo-icon {
    width: 48px;
    height: 48px;
    object-fit: contain;
    margin-bottom: 16px;
    display: block;
    margin-left: auto;
    margin-right: auto;
}

.story-continues .label {
    color: #888888;
    font-size: 0.70rem;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
    font-weight: 500;
}

.story-continues .label:last-child {
    margin-bottom: 0;
}

footer {

    padding: 18px 20px;
    color: #02102B;
    font-size: 0.7rem;
    background: #FFFFFF;
}


@media (max-width: 1200px) {

    .quarter-label h2 {

    .timeline-line {
        display: block;
        width: 2px;
        margin-right: 12px;
        align-self: stretch;
    }

    .timeline-line.short {
        display: block;
        height: 40px;
        margin-top: 4px;
        margin-right: 0;
        align-self: flex-start;
    }

    .winners-grid {
        flex: 1;

        grid-template-columns: repeat(3, 1fr);
        gap: 16px 10px;
    }

    .winner-card-image {
        width: 48px;
        height: 48px;
        margin-bottom: 8px;

    .winner-card h3 {
        font-size: 0.78rem;

    .winner-card p {
        font-size: 0.68rem;

    }

    .stay-tuned-track {

        transform: translateZ(0);

    }

    .stay-tuned-text {
        font-size: 0.82rem;
        animation: stayTunedRight 12s linear infinite;
    }
}

@media (max-width: 380px) {
    .quarter-label,
    .stay-tuned-block .quarter-label {

    .quarter-label h2 {
        font-size: 0.85rem;
    }

    .timeline-line {
        margin-right: 8px;
    }

    .winners-grid {
        gap: 12px 8px;
    }

    .winner-card-image {

        height: 42px;
    }

    .winner-card h3 {

    .winner-card .department {

    }

    .winner-card p {

    }

    .stay-tuned-text {
        font-size: 0.75rem;
    }
}

@media (prefers-reduced-motion: reduce) {
    .stay-tuned-block,
    .quarter-block {
        opacity: 1 !important;
        transition: none;
    }
    .stay-tuned-text {
        animation: none !important;
        position: static;
        transform: none;
        left: auto;
        top: auto;
        white-space: normal;
    }
}
</style>

<script>

const dimBlocks = document.querySelectorAll(".stay-tuned-block, .quarter-block");

function setActiveBlock(activeEl) {
    dimBlocks.forEach((block) => {
        if (block === activeEl) {
            block.classList.add("is-active-block");
        } else {
            block.classList.remove("is-active-block");
        }
    });
}

function updateDimFocus() {
    const viewportCenter = window.innerHeight / 2;
    let closestEl = null;
    let closestDist = Infinity;

    dimBlocks.forEach((block) => {
        const rect = block.getBoundingClientRect();
        if (rect.bottom < 0 || rect.top > window.innerHeight) return;

        const blockCenter = rect.top + rect.height / 2;
        const dist = Math.abs(blockCenter - viewportCenter);
        if (dist < closestDist) {
            closestDist = dist;
            closestEl = block;
        }
    });

    if (closestEl) {
        setActiveBlock(closestEl);
    }
}

window.addEventListener("scroll", updateDimFocus, { passive: true });
window.addEventListener("resize", updateDimFocus);
window.addEventListener("load", updateDimFocus);

requestAnimationFrame(() => {
    requestAnimationFrame(updateDimFocus);
});
</script>
